name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          languages: javascript-typescript
      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
