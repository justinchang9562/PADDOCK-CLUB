name: 质量检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安装锁定版本的依赖
        run: npm ci

      - name: 验证 npm 官方 registry
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: 执行代码规范、类型、单元测试与构建检查
        run: npm run check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安装锁定版本的依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 执行关键路由冒烟测试
        run: npm run test:e2e
